[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elfantasy"
version = "0.1.0"
description = "EuroLeague Fantasy Challenge squad predictor"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "duckdb>=1.0",
    "pyyaml>=6",
    "unidecode>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
model = ["lightgbm>=4", "scikit-learn>=1.4", "scipy>=1.11", "pulp>=2.8,<3", "highspy>=1.7", "shap>=0.44"]
notebook = ["jupyterlab>=4", "matplotlib>=3.8"]
dev = ["pytest>=8", "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
