name: Fantasy snapshot

# Saves the fantasy app's pre-deadline state (prices, probability of playing, projected
# lineups, ownership, injured flags) and commits it to snapshots/. This data cannot be
# fetched after a round starts, so it must be collected before every deadline.
#
# Regular-season deadlines (first tip-off) fall on Tue/Wed/Thu, never earlier than 16:00 UTC;
# play-offs and the Final Four also use Fridays and Sundays. The job runs twice a day, every
# day (10:41 and 14:41 UTC), so a late change is caught and one failed run is not fatal.
# Unchanged snapshots are not saved. Scheduled runs use the default branch.

on:
  schedule:
    - cron: "41 10,14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fantasy-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Take snapshot
        env:
          # Optional: add a repository secret ELF_FANTASY_TOKEN to also save in-app odds and injuries.
          ELF_FANTASY_TOKEN: ${{ secrets.ELF_FANTASY_TOKEN }}
        run: python -m elfantasy.data.snapshot

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "Fantasy snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "Push failed after retries" >&2
          exit 1
